services:
  mysql:
    image: mysql:8.0
    container_name: orders-products-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: orders_products_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
    ports:
      - "3307:3306"
    volumes:
      - orders_products_mysql_data:/var/lib/mysql

  adminer:
    image: adminer:latest
    container_name: orders-products-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - mysql

volumes:
  orders_products_mysql_data:
